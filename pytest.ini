[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure --output=test-results
base_url = https://www.saucedemo.com
markers =
    smoke: critical user journeys suitable for fast CI feedback
    regression: broader functional coverage
    no_auth: create a fresh unauthenticated browser context for login tests
